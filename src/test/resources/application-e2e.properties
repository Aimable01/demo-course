# E2E Test Configuration
# This configuration is used for end-to-end tests that simulate real-world scenarios

# Database configuration for E2E tests
spring.datasource.url=jdbc:h2:mem:testdb_e2e;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for E2E tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging configuration for E2E tests
logging.level.com.rca.demo_course=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Server configuration for E2E tests
server.port=0
server.error.include-message=always
server.error.include-binding-errors=always

# Management endpoints for E2E tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Test-specific configurations
spring.test.database.replace=none
spring.test.mockmvc.print=none

# Performance testing configurations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Connection pool settings for load testing
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Timeout configurations for E2E tests
spring.mvc.async.request-timeout=30000
